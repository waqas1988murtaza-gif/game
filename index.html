<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 EduPlay Sindh - Full Version</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 30px;
    max-width: 700px;
    width: 100%;
    text-align: center;
    position: relative;
  }
  h1 { color: #ff4081; font-size: 2.2em; margin-bottom: 5px; }
  .subtitle { color: #666; margin-bottom: 20px; font-size: 1em; }
  .screen { display: none; animation: fadeIn 0.5s; }
  .screen.active { display: block; }
  @keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
  
  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 1.1em;
    cursor: pointer;
    margin: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
  }
  .btn:hover { transform: scale(1.05); }
  .btn-class { background: linear-gradient(135deg, #f093fb, #f5576c); width: 140px; }
  .btn-subject { background: linear-gradient(135deg, #4facfe, #00f2fe); width: 160px; }
  .btn-option { background: white; color: #333; border: 3px solid #667eea; width: 100%; max-width: 400px; display: block; margin: 10px auto; text-align: left; padding-left: 25px; }
  
  .correct { background: #4caf50 !important; color: white !important; border-color: #4caf50 !important; }
  .wrong { background: #f44336 !important; color: white !important; border-color: #f44336 !important; }

  .audio-controls { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 1.5em; }
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
  .question-box { background: #fff3e0; border: 4px dashed #ff9800; border-radius: 20px; padding: 25px; margin: 20px 0; font-size: 1.4em; }
  .stats { display: flex; justify-content: space-around; background: #f5f5f5; border-radius: 15px; padding: 15px; margin-bottom: 20px; }
  .stat-value { font-size: 1.5em; font-weight: bold; color: #ff4081; }
  .progress-bar { background: #e0e0e0; border-radius: 10px; height: 15px; overflow: hidden; margin: 10px 0; }
  .progress-fill { background: linear-gradient(90deg, #4caf50, #8bc34a); height: 100%; transition: width 0.5s; }
</style>
</head>
<body>

<div class="container">
    <div class="audio-controls" onclick="toggleMusic()" id="musicToggle">🔊</div>

    <!-- HOME SCREEN -->
    <div id="home" class="screen active">
        <div class="mascot">👦📚👧</div>
        <h1>🎮 EduPlay Sindh</h1>
        <p class="subtitle">Pre-Nursery to Class 5 • Sindh Textbook Board</p>
        <div class="stats">
            <div class="stat"><div class="stat-value" id="totalStars">0</div><div>⭐ Stars</div></div>
            <div class="stat"><div class="stat-value" id="totalBadges">0</div><div>🏅 Badges</div></div>
        </div>
        <button class="btn" onclick="show('classSelect')">🚀 Start Learning</button>
        <button class="btn" onclick="resetProgress()" style="background:#f44336; font-size: 0.8em;">🔄 Reset</button>
    </div>

    <!-- CLASS SELECT -->
    <div id="classSelect" class="screen">
        <h2>📚 Choose Your Class</h2>
        <div class="grid" id="classGrid"></div>
        <button class="btn" onclick="show('home')" style="background:#999;">⬅ Back</button>
    </div>

    <!-- SUBJECT SELECT -->
    <div id="subjectSelect" class="screen">
        <h2 id="subjectTitle">📖 Choose Subject</h2>
        <div class="grid" id="subjectGrid"></div>
        <button class="btn" onclick="show('classSelect')" style="background:#999;">⬅ Back</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz" class="screen">
        <div class="stats">
            <div id="qNum" class="stat-value">1/5</div>
            <div id="qScore" class="stat-value" style="color:#4caf50">0</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="question-box" id="questionText">...</div>
        <div id="optionsBox"></div>
        <p id="feedback" style="font-size:1.2em; font-weight:bold; margin-top:10px;"></p>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result" class="screen">
        <div class="mascot" id="resultMascot">🎉</div>
        <h1 id="resultTitle">Well Done!</h1>
        <div id="resultStars" style="font-size: 3em; margin:10px;">⭐⭐⭐</div>
        <h2 id="resultScore">5/5</h2>
        <button class="btn" onclick="show('subjectSelect')">📚 Other Subject</button>
        <button class="btn" onclick="show('home')" style="background:#999;">🏠 Home</button>
    </div>
</div>

<audio id="bgMusic" loop src="https://actions.google.com/config/music/childrens_adventure.mp3"></audio>
<audio id="correctSound" src="https://actions.google.com/config/music/success_bell.mp3"></audio>
<audio id="wrongSound" src="https://actions.google.com/config/music/fail_buzzer.mp3"></audio>

<script>
// ============ THE COMPLETE DATABASE (RESTORED) ============
const QUESTIONS = {
  "Pre-Nursery": {
    "Colors": [
      {q:"What color is the Sun? ☀️", o:["Yellow","Blue","Green","Black"], a:"Yellow"},
      {q:"What color is grass? 🌱", o:["Red","Green","Pink","Brown"], a:"Green"},
      {q:"What color is milk? 🥛", o:["White","Black","Blue","Red"], a:"White"},
      {q:"What color is an apple? 🍎", o:["Red","Blue","Black","Grey"], a:"Red"},
      {q:"What color is the sky? ☁️", o:["Blue","Purple","Pink","Orange"], a:"Blue"}
    ],
    "Shapes": [
      {q:"What shape is a ball? ⚽", o:["Circle","Square","Triangle","Star"], a:"Circle"},
      {q:"What shape is a book? 📕", o:["Rectangle","Circle","Triangle","Star"], a:"Rectangle"},
      {q:"How many sides does a triangle have?", o:["2","3","4","5"], a:"3"},
      {q:"What shape is a pizza slice? 🍕", o:["Triangle","Square","Circle","Heart"], a:"Triangle"},
      {q:"What shape has 4 equal sides?", o:["Square","Circle","Triangle","Oval"], a:"Square"}
    ]
  },
  "Nursery": {
    "Alphabets": [
      {q:"A is for ___? 🍎", o:["Apple","Ball","Cat","Dog"], a:"Apple"},
      {q:"B is for ___? ⚽", o:["Apple","Ball","Cat","Dog"], a:"Ball"},
      {q:"C is for ___? 🐱", o:["Apple","Ball","Cat","Dog"], a:"Cat"},
      {q:"Which letter comes after E?", o:["D","F","G","H"], a:"F"},
      {q:"Which letter is first?", o:["B","A","C","D"], a:"A"}
    ],
    "Numbers": [
      {q:"How many fingers on one hand? ✋", o:["3","4","5","6"], a:"5"},
      {q:"What comes after 3?", o:["2","4","5","1"], a:"4"},
      {q:"Count: 🍎🍎🍎", o:["2","3","4","5"], a:"3"}
    ]
  },
  "KG": {
    "English": [
      {q:"Spell: C-A-T", o:["Cat","Cap","Car","Can"], a:"Cat"},
      {q:"Opposite of BIG?", o:["Tall","Small","Long","Wide"], a:"Small"}
    ],
    "Math": [
      {q:"2 + 2 = ?", o:["3","4","5","6"], a:"4"},
      {q:"5 + 1 = ?", o:["4","5","6","7"], a:"6"}
    ]
  },
  "Class 1": {
    "English": [
        {q:"Plural of Book?", o:["Books","Bookes","Bookies","Book"], a:"Books"},
        {q:"A ___ flies in sky", o:["Fish","Bird","Cow","Dog"], a:"Bird"}
    ],
    "Math": [
        {q:"12 + 3 = ?", o:["14","15","16","17"], a:"15"},
        {q:"Which is bigger? 7 or 9", o:["7","9","Same","None"], a:"9"}
    ],
    "Sindhi": [
        {q:"Paani cha aahe?", o:["Water","Fire","Wind","Earth"], a:"Water"},
        {q:"Saj cha aahe?", o:["Sun","Moon","Star","Cloud"], a:"Sun"}
    ]
  },
  "Class 2": {
    "English": [{q:"Past of 'Go'?", o:["Goed","Went","Gone","Going"], a:"Went"}],
    "Math": [{q:"5 × 4 = ?", o:["15","20","25","30"], a:"20"}]
  },
  "Class 3": {
    "English": [{q:"Synonym of 'Happy'?", o:["Sad","Glad","Angry","Tired"], a:"Glad"}],
    "Math": [{q:"12 × 5 = ?", o:["50","55","60","65"], a:"60"}],
    "Computer": [{q:"CPU is called?", o:["Brain of computer","Screen","Keyboard","Mouse"], a:"Brain of computer"}]
  },
  "Class 4": {
    "Science": [{q:"We breathe in?", o:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"], a:"Oxygen"}],
    "Math": [{q:"25 × 4 = ?", o:["75","100","125","150"], a:"100"}]
  },
  "Class 5": {
    "English": [{q:"Correct spelling?", o:["Recieve","Receive","Receeve","Receave"], a:"Receive"}],
    "Math": [{q:"25% of 200?", o:["25","50","75","100"], a:"50"}],
    "Islamiat": [{q:"How many pillars of Islam?", o:["3","4","5","6"], a:"5"}]
  }
};

// ============ STATE & LOGIC ============
let state = JSON.parse(localStorage.getItem('eduplay_save')) || { stars: 0, badges: 0 };
let current = { idx:0, score:0, questions:[], class:'', subject:'' };
let isMusicPlaying = false;

function toggleMusic() {
    const bg = document.getElementById('bgMusic');
    const icon = document.getElementById('musicToggle');
    if (isMusicPlaying) { bg.pause(); icon.textContent = "🔇"; }
    else { bg.play().catch(()=>{}); icon.textContent = "🔊"; }
    isMusicPlaying = !isMusicPlaying;
}

function show(id) {
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id==='classSelect') buildClasses();
    if(id==='home') updateHome();
}

function buildClasses() {
    const grid = document.getElementById('classGrid');
    grid.innerHTML = '';
    Object.keys(QUESTIONS).forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-class';
        btn.textContent = c;
        btn.onclick = () => { current.class = c; buildSubjects(); show('subjectSelect'); };
        grid.appendChild(btn);
    });
}

function buildSubjects() {
    document.getElementById('subjectTitle').textContent = `📖 ${current.class}`;
    const grid = document.getElementById('subjectGrid');
    grid.innerHTML = '';
    Object.keys(QUESTIONS[current.class]).forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-subject';
        btn.textContent = s;
        btn.onclick = () => startQuiz(s);
        grid.appendChild(btn);
    });
}

function startQuiz(sub) {
    current.subject = sub;
    current.questions = [...QUESTIONS[current.class][sub]].sort(()=>Math.random()-0.5);
    current.idx = 0; current.score = 0;
    show('quiz'); loadQuestion();
}

function loadQuestion() {
    const q = current.questions[current.idx];
    document.getElementById('qNum').textContent = `${current.idx+1}/${current.questions.length}`;
    document.getElementById('qScore').textContent = `⭐ ${current.score}`;
    document.getElementById('progressFill').style.width = `${(current.idx/current.questions.length)*100}%`;
    document.getElementById('questionText').textContent = q.q;
    document.getElementById('feedback').textContent = '';
    
    const box = document.getElementById('optionsBox');
    box.innerHTML = '';
    q.o.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-option';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(btn, opt, q.a);
        box.appendChild(btn);
    });
}

function checkAnswer(btn, chosen, correct) {
    document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
    if(chosen === correct) {
        btn.classList.add('correct');
        document.getElementById('correctSound').play();
        current.score++;
        document.getElementById('feedback').textContent = "Correct! 🌟";
    } else {
        btn.classList.add('wrong');
        document.getElementById('wrongSound').play();
        document.getElementById('feedback').textContent = "Oops! Answer: " + correct;
    }
    setTimeout(() => {
        current.idx++;
        if(current.idx < current.questions.length) loadQuestion();
        else finish();
    }, 1500);
}

function finish() {
    const total = current.questions.length;
    let stars = current.score === total ? 3 : current.score >= total/2 ? 2 : 1;
    state.stars += stars;
    if(stars === 3) state.badges++;
    localStorage.setItem('eduplay_save', JSON.stringify(state));
    
    document.getElementById('resultStars').textContent = "⭐".repeat(stars);
    document.getElementById('resultScore').textContent = `${current.score}/${total}`;
    show('result');
}

function updateHome() {
    document.getElementById('totalStars').textContent = state.stars;
    document.getElementById('totalBadges').textContent = state.badges;
}

function resetProgress() {
    if(confirm("Reset everything?")) {
        state = { stars: 0, badges: 0 };
        localStorage.setItem('eduplay_save', JSON.stringify(state));
        updateHome();
    }
}

updateHome();
</script>
</body>
</html>
